apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
spec:
  replicas: 2
  selector:
    matchLabels: {app: vote}
  template:
    metadata:
      labels: {app: vote}
    spec:
      containers:
        - name: vote
          image: voting-vote:placeholder
          imagePullPolicy: Never
          ports:
            - {containerPort: 80}
          env:
            - {name: REDIS, value: redis}
---
apiVersion: v1
kind: Service
metadata:
  name: voting-service
spec:
  type: ClusterIP
  selector: {app: vote}
  ports:
    - {port: 80, targetPort: 80}
