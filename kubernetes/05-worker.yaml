apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: voting-worker:placeholder
          imagePullPolicy: Never
          env:
            - {name: REDIS, value: redis}
            - {name: DB, value: db}
