apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
spec:
  replicas: 1
  selector:
    matchLabels: {app: result}
  template:
    metadata:
      labels: {app: result}
    spec:
      containers:
        - name: result
          image: voting-result:placeholder
          imagePullPolicy: Never
          ports:
            - {containerPort: 80}
          env:
            - {name: DATABASE, value: db}
---
apiVersion: v1
kind: Service
metadata:
  name: result-service
spec:
  type: ClusterIP
  selector: {app: result}
  ports:
    - {port: 80, targetPort: 80}
