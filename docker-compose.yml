name: votingapp-cicd
services:
  jenkins:
    build: ./jenkins
    container_name: voting-jenkins
    user: root
    restart: unless-stopped
    ports: ["8080:8080", "50000:50000"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.secrets/kubeconfig:/var/jenkins_home/.kube/config:ro
      - ./kubernetes:/workspace/kubernetes:ro
    networks: [cicd]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 120s

  sonarqube:
    image: sonarqube:community
    container_name: voting-sonarqube
    restart: unless-stopped
    depends_on:
      sonardb:
        condition: service_healthy
    ports: ["9000:9000"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-change_me_sonar_db_password}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks: [cicd]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q UP"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

  sonardb:
    image: postgres:16-alpine
    container_name: voting-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-change_me_sonar_db_password}
      POSTGRES_DB: sonarqube
    volumes:
      - sonardb_data:/var/lib/postgresql/data
    networks: [cicd]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 15

networks:
  cicd:
    name: voting-cicd
volumes:
  jenkins_home:
    name: voting-jenkins-home
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonardb_data:
